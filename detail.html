<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail — Zenou Unblocked</title>
<meta name="theme-color" content="#05070a">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="play-body">

<header class="topbar play-topbar">
  <a class="wordmark" href="index.html" aria-label="Back to Zenou Unblocked">
    <span class="wordmark-lines">Zen<span class="wordmark-joystick" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="stick" d="M12 4a3.2 3.2 0 0 1 3.2 3.2c0 1.4-.9 2.5-2 2.9V18h-2.4V10.1c-1.1-.4-2-1.5-2-2.9A3.2 3.2 0 0 1 12 4z"/><path class="base" d="M4.5 18h15c1.4 0 2.5 1.1 2.5 2.5V22H2v-1.5C2 19.1 3.1 18 4.5 18z"/></svg></span>u</span>
    <span class="wordmark-sub">unblocked</span>
  </a>
  <button id="backBtn" class="btn btn-ghost" type="button">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5l-7 7 7 7 1.4-1.4L7.8 13H20v-2H7.8l4.6-4.6L11 5z"/></svg>
    <span>Back</span>
  </button>
</header>

<main class="play-main">
  <div id="skRow" style="display:flex;gap:14px;margin-top:20px">
    <div class="skl" style="width:220px;flex:none;border-radius:16px"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:12px">
      <div class="skl" style="aspect-ratio:auto;height:38px;width:60%"></div>
      <div class="skl" style="aspect-ratio:auto;height:16px;width:35%"></div>
      <div class="skl" style="aspect-ratio:auto;height:120px"></div>
    </div>
  </div>

  <article id="body" class="mdetail" hidden>
    <img id="thumb" class="thumb" alt="">
    <div>
      <h1 id="bigTitle" class="mtitle"></h1>
      <p id="sub" class="msub"></p>
      <div id="stats" class="mstats"></div>
      <p id="desc" class="moverview"></p>
      <p id="castRow" class="mcast"></p>
      <div id="trailerBox" style="margin-top:22px" hidden>
        <div class="watch-stage" id="trailerStage"></div>
        <p style="font-size:12px;color:var(--muted);margin:6px 0 0">Official trailer via YouTube — trailers are not the full film.</p>
      </div>
      <div id="seasons" class="season-chip-row" hidden>
        <h2 style="font:700 17px/1.2 var(--font-display);margin:0 0 10px">Seasons</h2>
        <div id="seasonChips"></div>
        <ul id="epList" class="ep-list" hidden></ul>
      </div>
      <div class="mactions">
        <a id="playBtn" class="btn btn-solid btn-lg" href="#"></a>
        <button id="watchBtn" class="btn btn-lg btn-tog" type="button" aria-pressed="false"><span>Watchlist</span></button>
        <button id="likeBtn" class="btn btn-lg btn-tog" type="button" aria-pressed="false"><span>Favorite</span></button>
        <a id="imdbBtn" class="btn btn-ghost" target="_blank" rel="noopener" hidden>IMDb page</a>
      </div>
    </div>
  </article>

  <aside id="rec" style="margin-top:36px" hidden>
    <h2 class="section-title">More like this</h2>
    <div class="mgrid" id="recGrid"></div>
  </aside>

  <div id="notFound" class="external-panel" hidden>
    <h2>Not in the local catalogue</h2>
    <p>This title isn't in the cached TMDB snapshot. Refresh the data with scripts/fetch-tmdb.mjs, or search the live Archive.</p>
    <a href="movies.html" class="btn btn-solid btn-lg"><span>Back to movies</span></a>
  </div>
</main>

<div id="pbHost"></div>
<script src="js/music-player.js" defer></script>
<script src="js/settings.js" defer></script>
<script src="js/ent.js" defer></script>
<script src="js/media.js" defer></script>
<script src="js/detail.js" defer></script>
</body>
</html>
