<!doctype html>
<html><body><pre id="o">starting</pre>
<script>
(async function(){
  var o = document.getElementById('o');
  var lines = [];
  lines.push('coi:' + window.crossOriginIsolated);
  try { new WebAssembly.Memory({initial:1n,maximum:2n,shared:true,address:'i64'}); lines.push('bigint:ok'); }
  catch(e){ lines.push('bigint:no ' + e.message); }
  o.textContent = lines.join(' ');
  if (!window.crossOriginIsolated && 'serviceWorker' in navigator) {
    await navigator.serviceWorker.register('coi-sw.js', {scope:'./'});
    await navigator.serviceWorker.ready;
    var n = +(sessionStorage.getItem('chk')||0);
    if (n < 2) { sessionStorage.setItem('chk', String(n+1)); location.reload(); return; }
    o.textContent += ' nocoi';
  }
})();
</script></body></html>
