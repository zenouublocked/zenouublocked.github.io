<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var r=document.documentElement,p=JSON.parse(localStorage.getItem('zenou_prefs')||'{}'),m=JSON.parse(localStorage.getItem('zenou_mask')||'{}');var t=p.theme||m.theme;if(t)r.dataset.theme=t;['glow','radius','density','bg','motion'].forEach(function(k){if(p[k])r.dataset[k]=p[k]});if(p.bgDim!=null)r.style.setProperty('--bg-dim',Math.max(0,Math.min(85,+p.bgDim))/100);var g=localStorage.getItem('zenou_bgimg');if(g){r.style.setProperty('--custom-bg','url("'+g+'")');r.classList.add('has-custom')}}catch(e){}</script>
<title>Watch — Zenou Unblocked</title>
<meta name="theme-color" content="#07080e">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="play-body">

<header class="topbar play-topbar">
  <a class="wordmark" href="index.html" aria-label="Back to Zenou Unblocked">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4a3.2 3.2 0 0 1 3.2 3.2c0 1.4-.9 2.5-2 2.9V18h-2.4V10.1c-1.1-.4-2-1.5-2-2.9A3.2 3.2 0 0 1 12 4z"/><path d="M4.5 18h15c1.4 0 2.5 1.1 2.5 2.5V22H2v-1.5C2 19.1 3.1 18 4.5 18z"/></svg></span>
    <span class="wordmark-text">
      <span class="wordmark-lines">Zenou</span>
      <span class="wordmark-sub">unblocked</span>
    </span>
  </a>
  <button id="backBtn" class="btn btn-ghost" type="button">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5l-7 7 7 7 1.4-1.4L7.8 13H20v-2H7.8l4.6-4.6L11 5z"/></svg>
    <span>Back</span>
  </button>
</header>

<main class="play-main">
  <div id="skRow" class="skl" style="height:52%;margin-top:20px;aspect-ratio:16/9;border:1px solid var(--line)"></div>

  <section id="watchView" hidden>
    <div class="watch-stage" id="stage" hidden>
      <iframe id="frame" title="Player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin-when-cross-origin" hidden></iframe>
      <div id="loading" class="loading"><div class="loading-stick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4a3.2 3.2 0 0 1 3.2 3.2c0 1.4-.9 2.5-2 2.9V18h-2.4V10.1c-1.1-.4-2-1.5-2-2.9A3.2 3.2 0 0 1 12 4z"/><path d="M4.5 18h15c1.4 0 2.5 1.1 2.5 2.5V22H2v-1.5C2 19.1 3.1 18 4.5 18z"/></svg></div><p>Getting the source…</p></div>
    </div>

    <div id="extBox" class="external-panel" hidden>
      <h2 id="extTitle">No playable source on this site</h2>
      <p id="extReason"></p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">
        <a id="extTrailer" class="btn btn-solid btn-lg" target="_blank" rel="noopener" hidden>Watch trailer on YouTube</a>
        <a id="extOfficial" class="btn btn-ghost btn-lg" target="_blank" rel="noopener" hidden>Official page</a>
      </div>
    </div>

    <div id="providerRow" style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap" hidden></div>

    <aside class="game-info">
      <div class="game-info-main">
        <h1 id="wTitle" class="game-title"></h1>
        <p id="wMeta" class="game-meta"></p>
        <p id="wNote" class="embed-note" hidden></p>
      </div>
      <div class="game-info-side">
        <p id="wSource" class="game-source"></p>
      </div>
    </aside>
  </section>
</main>

<div id="pbHost"></div>
<script src="js/atmosphere.js" defer></script>

<script src="js/music-player.js" defer></script>
<script src="js/settings.js" defer></script>
<script src="js/ent.js" defer></script>
<script src="js/media.js" defer></script>
<script src="js/providers.js" defer></script>
<script src="js/watch.js" defer></script>
</body>
</html>
