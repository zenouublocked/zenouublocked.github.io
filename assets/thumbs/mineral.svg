<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Mineral — Minecraft in the browser">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12261f"/>
      <stop offset="0.52" stop-color="#0b1614"/>
      <stop offset="1" stop-color="#060a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#34d399" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fae4a"/>
      <stop offset="0.28" stop-color="#3f8a38"/>
      <stop offset="1" stop-color="#2a5f2a"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6440"/>
      <stop offset="1" stop-color="#4d3524"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e969c"/>
      <stop offset="1" stop-color="#575f66"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#e0a83a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- pixel stars -->
  <g fill="#dff8e8" opacity="0.55">
    <rect x="120" y="86" width="3" height="3"/><rect x="268" y="140" width="2" height="2"/>
    <rect x="404" y="70" width="3" height="3"/><rect x="612" y="118" width="2" height="2"/>
    <rect x="742" y="64" width="3" height="3"/><rect x="886" y="132" width="2" height="2"/>
    <rect x="1012" y="88" width="3" height="3"/><rect x="1148" y="150" width="2" height="2"/>
    <rect x="196" y="214" width="2" height="2"/><rect x="948" y="228" width="2" height="2"/>
  </g>

  <!-- floating blocks -->
  <g opacity="0.9">
    <g transform="translate(862 206)">
      <polygon points="0,44 76,0 152,44 76,88" fill="url(#grass)"/>
      <polygon points="0,44 76,88 76,160 0,116" fill="#4b7f3c"/>
      <polygon points="152,44 76,88 76,160 152,116" fill="#33632f"/>
    </g>
    <g transform="translate(1038 330)" opacity="0.82">
      <polygon points="0,34 58,0 116,34 58,68" fill="url(#stone)"/>
      <polygon points="0,34 58,68 58,124 0,90" fill="#4f565d"/>
      <polygon points="116,34 58,68 58,124 116,90" fill="#3b4147"/>
    </g>
    <g transform="translate(760 356)" opacity="0.75">
      <polygon points="0,26 44,0 88,26 44,52" fill="url(#gold)"/>
      <polygon points="0,26 44,52 44,96 0,70" fill="#c08f2f"/>
      <polygon points="88,26 44,52 44,96 88,70" fill="#a0741f"/>
    </g>
  </g>

  <!-- ground -->
  <g>
    <polygon points="0,584 640,440 1280,584 1280,720 0,720" fill="url(#dirt)" opacity="0.55"/>
    <g transform="translate(-40 470) scale(1.05)">
      <polygon points="0,104 180,0 360,104 180,208" fill="url(#grass)"/>
      <polygon points="0,104 180,208 180,360 0,256" fill="#4a7d3b"/>
      <polygon points="360,104 180,208 180,360 360,256" fill="#2f5c2c"/>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1280" height="720" fill="#04070a" opacity="0.28"/>
  <rect width="1280" height="720" fill="none" stroke="#4ade80" stroke-opacity="0.18" stroke-width="2"/>

  <!-- wordmark -->
  <g>
    <rect x="72" y="150" width="86" height="6" rx="3" fill="#4ade80"/>
    <text x="72" y="290" font-family="Archivo, Arial Black, Arial, sans-serif" font-size="118" font-weight="900" letter-spacing="6" fill="#f4fff7">MINERAL</text>
    <text x="76" y="346" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="1.5" fill="#a7f3c9">Minecraft in the browser</text>
    <g transform="translate(74 396)">
      <rect width="128" height="34" rx="17" fill="#4ade80" fill-opacity="0.16" stroke="#4ade80" stroke-opacity="0.45"/>
      <text x="64" y="23" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#d9ffe8">NO INSTALL</text>
    </g>
  </g>
</svg>
