<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>COI test</title>
<style>html,body{margin:0;height:100%;background:#111;color:#fff}iframe{width:100%;height:100vh;border:0}</style>
</head>
<body>
<script>
(async () => {
  if (window.crossOriginIsolated) { document.body.dataset.coi = '1'; return; }
  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      const n = +(sessionStorage.getItem('coiReload') || 0);
      if (n < 2) {
        sessionStorage.setItem('coiReload', String(n + 1));
        location.reload();
      }
    } catch (err) { document.title = 'SW failed: ' + err.message; }
  }
})();
</script>
<iframe id="f" src="https://fiveplay.lol/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads allow-presentation" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"></iframe>
</body>
</html>
